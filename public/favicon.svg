<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-labelledby="title"
>
  <title id="title">CozyMoney</title>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="14"
    fill="oklch(62% 0.19 255)"
  />

  <!-- C -->
  <path
    d="M42 19
       C37 16 30 16 25 19
       C20 22 18 27 18 32
       C18 37 20 42 25 45
       C30 48 37 48 42 45"
    fill="none"
    stroke="white"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Calculator -->
  <rect
    x="28"
    y="23"
    width="14"
    height="20"
    rx="3"
    fill="white"
  />

  <!-- Calculator display -->
  <rect
    x="31"
    y="26"
    width="8"
    height="4"
    rx="1"
    fill="oklch(62% 0.19 255)"
  />

  <!-- Calculator buttons -->
  <circle cx="32.5" cy="34" r="1.5" fill="oklch(62% 0.19 255)" />
  <circle cx="37.5" cy="34" r="1.5" fill="oklch(62% 0.19 255)" />
  <circle cx="32.5" cy="39" r="1.5" fill="oklch(62% 0.19 255)" />
  <circle cx="37.5" cy="39" r="1.5" fill="oklch(62% 0.19 255)" />

  <!-- Coin -->
  <circle
    cx="46"
    cy="43"
    r="8"
    fill="oklch(88% 0.17 88)"
  />

  <path
    d="M46 38.5V47.5
       M43.5 41
       C44.5 39.5 48.5 39.5 49 41
       C49.5 42.5 47.5 43 46 43
       C44.5 43 42.5 43.5 43 45
       C43.5 46.5 47.5 46.5 48.5 45"
    fill="none"
    stroke="oklch(62% 0.19 255)"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>
